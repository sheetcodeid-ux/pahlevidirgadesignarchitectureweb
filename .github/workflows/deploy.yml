name: Deploy

# Deploy otomatis begitu branch produksi berubah. Sebelumnya deploy harus
# dijalankan tangan dari mesin yang sudah `wrangler login`, jadi kode yang
# sudah di-merge bisa menganggur berhari-hari tanpa tayang — dan pernah
# tayang setengah jalan karena satu Worker ter-deploy dan satunya tidak.
on:
  push:
    branches: [claude/stack-setup-supabase-cloudflare-kdwlkk]
  # Biar bisa dijalankan ulang dari tab Actions tanpa harus push apa pun.
  workflow_dispatch:

# Dua deploy berbarengan ke Worker yang sama bisa saling menimpa dengan
# urutan yang tidak terduga, jadi run baru membatalkan yang masih berjalan.
# Itu aman HANYA karena setiap run mengambil ujung branch, bukan commit
# pemicunya — lihat catatan pada langkah checkout di bawah.
concurrency:
  group: deploy-produksi
  cancel-in-progress: true

env:
  # Dibakar ke berkas statis saat build. Bukan rahasia — URL ini memang
  # dipanggil dari browser pengunjung. Tanpa ini, situs yang tayang
  # menunjuk http://localhost:8787 dan semua panggilan API gagal.
  #
  # Pakai custom domain, bukan *.workers.dev bawaan: alamat bawaan itu
  # punya rate limit tersendiri — hal yang sama sudah pernah menggigit di
  # R2 dan membuat kami pindah ke media.pahlevidirgaarchitecture.com.
  # Kalau baris ini salah, seluruh panggilan API gagal sekaligus (login
  # dan form kontak), jadi pastikan domainnya benar-benar terpasang ke
  # Worker pahlevidirga-api sebelum mengubahnya.
  PUBLIC_API_BASE_URL: https://api.pahlevidirgaarchitecture.com
  PUBLIC_SITE_URL: https://pahlevidirgaarchitecture.com

  # Site key Turnstile. BUKAN rahasia — ia memang tercetak di HTML halaman
  # kontak; yang rahasia adalah secret key, dan itu hidup sebagai secret
  # Worker API. Diambil dari repository VARIABLE (Settings → Secrets and
  # variables → Actions → Variables), bukan secret, supaya nilainya bisa
  # dibaca dan diperiksa.
  #
  # Kalau kosong, ContactForm tidak merender widgetnya sama sekali dan form
  # mengirim token kosong. Akibatnya bergantung pada Worker API: kalau
  # TURNSTILE_SECRET_KEY di sana terisi, SETIAP kiriman pengunjung ditolak
  # "token turnstile kosong"; kalau tidak terisi, form terbuka untuk bot.
  # Dua-duanya tidak diinginkan — isi variabelnya.
  PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

jobs:
  api:
    name: Worker API
    runs-on: ubuntu-latest
    steps:
      # Ambil ujung branch produksi, bukan commit yang memicu run ini.
      #
      # Pernah menggigit: GitHub sempat menahan event push, lalu
      # mengirimnya tidak berurutan. Run untuk commit LAMA jadi mulai
      # belakangan, membatalkan run commit baru lewat concurrency di atas,
      # dan produksi berakhir memakai kode yang lebih lama — padahal
      # branch-nya sudah maju. Dengan ref di bawah, run mana pun yang
      # menang tetap men-deploy keadaan terbaru branch.
      - uses: actions/checkout@v4
        with:
          ref: claude/stack-setup-supabase-cloudflare-kdwlkk

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
        working-directory: apps/api

      # Gerbang sebelum deploy: yang merah tidak pernah tayang.
      - run: npm run typecheck
        working-directory: apps/api

      - run: npm test
        working-directory: apps/api

      # Sengaja memakai wrangler milik repo (devDependency, versi 4.x) lewat
      # npx, bukan cloudflare/wrangler-action — action itu memasang wrangler
      # versinya sendiri yang bisa berbeda dari yang dipakai saat
      # pengembangan.
      - run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # CATATAN — cache query Hyperdrive.
      #
      # Hyperdrive menyimpan hasil query di edge (bawaannya 60 detik) dan itu
      # sudah menggigit sungguhan: foto yang baru diunggah tidak muncul, cover
      # yang baru dipilih tidak berubah, dan refresh browser tidak menolong
      # karena cache-nya bukan di browser. Untuk studio sebesar ini cache itu
      # tidak memberi keuntungan apa pun — bebannya nol.
      #
      # Langkah otomatis untuk mematikannya SEMPAT ADA di sini, tapi dilepas:
      # CLOUDFLARE_API_TOKEN bisa men-deploy Worker namun ditolak saat
      # menyentuh endpoint Hyperdrive (Authentication error 10000, run #26).
      # Membiarkannya membuat SETIAP deploy merah padahal Worker-nya sudah
      # tayang — dan deploy yang merah terus-menerus melatih orang
      # mengabaikan merah, persis saat merah itu akhirnya berarti sesuatu.
      #
      # Jadi setelannya dimatikan sekali lewat dashboard Cloudflare
      # (Hyperdrive > pahlevidirga-db > Caching > Disable). Kalau nanti token
      # diberi izin "Hyperdrive: Edit", langkah otomatisnya bisa dikembalikan
      # supaya setelan ini tidak bisa diam-diam berubah lagi.

  web:
    name: Worker situs statis
    runs-on: ubuntu-latest
    steps:
      # Ambil ujung branch produksi, bukan commit yang memicu run ini.
      #
      # Pernah menggigit: GitHub sempat menahan event push, lalu
      # mengirimnya tidak berurutan. Run untuk commit LAMA jadi mulai
      # belakangan, membatalkan run commit baru lewat concurrency di atas,
      # dan produksi berakhir memakai kode yang lebih lama — padahal
      # branch-nya sudah maju. Dengan ref di bawah, run mana pun yang
      # menang tetap men-deploy keadaan terbaru branch.
      - uses: actions/checkout@v4
        with:
          ref: claude/stack-setup-supabase-cloudflare-kdwlkk

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        working-directory: apps/web

      - run: npm run check
        working-directory: apps/web

      - run: npm run build
        working-directory: apps/web

      # wrangler.jsonc situs statis ada di akar repo (assets.directory-nya
      # menunjuk ./apps/web/dist), dan wrangler-nya devDependency di akar
      # juga — jadi dependensi akar harus dipasang sebelum deploy. Worker
      # ini murni aset statis tanpa "main"; wrangler v3 menolaknya dengan
      # "Missing entry-point", jadi versi 4.x dari repo inilah yang dipakai.
      - run: npm ci

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

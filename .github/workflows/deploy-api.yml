name: Deploy API ke Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  SERVICE: pahlevidirga-api
  # Satu region dengan Supabase (ap-southeast-1). Free tier Cloud Run hanya
  # berlaku di us-central1/us-east1/us-west1, jadi region ini ditagih normal —
  # tapi API ini tidak dilalui pengunjung biasa, sehingga pemakaiannya beberapa
  # ratus request per bulan dan biayanya di bawah $1. Menaruhnya di AS demi
  # free tier justru membuat setiap query database menyeberangi Pasifik.
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Diperlukan oleh Workload Identity Federation — tidak ada service account
    # key JSON yang perlu disimpan sebagai secret.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source apps/api \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --timeout 30s \
            --set-env-vars "APP_ENV=production,ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }},R2_PUBLIC_BASE_URL=${{ vars.R2_PUBLIC_BASE_URL }},R2_BUCKET=${{ vars.R2_BUCKET }},R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }},INQUIRY_NOTIFY_TO=${{ vars.INQUIRY_NOTIFY_TO }},INQUIRY_FROM=${{ vars.INQUIRY_FROM }}" \
            --set-secrets "DATABASE_URL=database-url:latest,SUPABASE_JWT_SECRET=supabase-jwt-secret:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,TURNSTILE_SECRET_KEY=turnstile-secret:latest,RESEND_API_KEY=resend-api-key:latest,IP_HASH_SALT=ip-hash-salt:latest"

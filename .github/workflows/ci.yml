name: CI

on:
  push:
    branches: [main]
  pull_request:

# Batalkan run lama saat ada push baru ke branch yang sama — menit Actions
# gratis tidak perlu dihabiskan untuk commit yang sudah ketinggalan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundling (dry-run)
        run: npx wrangler deploy --dry-run

  web:
    name: Web (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Build CI tidak menghubungi backend; klien API sudah menangani
          # kegagalan fetch dengan halaman kosong, jadi ini cukup untuk
          # membuktikan template dan tipe tidak rusak.
          PUBLIC_SITE_URL: https://example.com

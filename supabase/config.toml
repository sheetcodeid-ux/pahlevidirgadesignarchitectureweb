# Konfigurasi Supabase CLI untuk stack lokal (supabase start).
project_id = "pahlevidirga"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# Staf studio diundang manual lewat dashboard; tidak ada pendaftaran publik.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = false # media disimpan di Cloudflare R2, bukan Supabase Storage
